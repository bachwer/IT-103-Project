<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link href="./css/style.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://images.crunchbase.com/image/upload/c_pad,h_256,w_256,f_auto,q_auto:eco,dpr_1/cjauy3xmerrn469wrwk9">

</head>
<body>
<div class="notification" id="notification">

    <div class="notification_error" id="notification_error">
        <img id="iconError" src="assets/error.png" height="16" width="16" alt="icon"/>
        <span>Error</span>
    </div>

    <img id="iconSuccess" src="assets/iconSuccess.png" height="20" width="20" alt="icon"/>

    <p id="textInPop"></p>
</div>



<div class="login">
    <img alt="logo" src="assets/logo.png">
    <p id="title" class="title">Please sign in</p>

        <label for="email"></label><input id="email" placeholder="Email address" type="email">
        <label for="userName"></label><input id="userName" placeholder="Username" type="text">
        <label for="password"></label><input id="password" placeholder="Password" type="password">

        <div class="remember-me" id="remember-box">
            <input id="remember-me" type="checkbox">
            <label for="remember-me">Remember me</label>
        </div>
        <p><span id="textSign">Don't have an account,</span> &nbsp <a class="back-link" href="#" id="back-to-Sign">Click here!</a></p>

        <button id="SignIn" type="submit">Sign in</button>

        <div class="login-footer">
            <p id="textFooter">&copy; 2025 - Rikkei Education</p>
        </div>

</div>
<script src="./js/dataReceipt.js"></script>
<script src="./js/Login-register.js"></script>



</body>
</html>
